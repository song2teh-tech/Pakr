name: Build Clean APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target URL (e.g. https://site.com)'
        required: true
      app_name:
        description: 'App Name (English)'
        required: true
      icon_url:
        description: 'Icon Image URL (optional, direct link)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean old files and generate standard Android project
        env:
          IN_APP_URL: ${{ github.event.inputs.app_url }}
          IN_APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties gradlew gradlew.bat gradle
          
          mkdir -p app/src/main/java/com/myapp/webview
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p gradle/wrapper

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyWebViewApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.myapp.webview'
              compileSdk 34
              defaultConfig {
                  applicationId "com.myapp.webview"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="__APP_NAME__"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/myapp/webview/MainActivity.java
          package com.myapp.webview;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("__APP_URL__");
              }
          }
          EOF

          sed -i "s|__APP_URL__|$IN_APP_URL|g" app/src/main/java/com/myapp/webview/MainActivity.java
          sed -i "s|__APP_NAME__|$IN_APP_NAME|g" app/src/main/AndroidManifest.xml

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure Gradle Wrapper
        run: |
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Handle Icon
        env:
          IN_ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          if [ -n "$IN_ICON_URL" ]; then
            curl -sSL -A "Mozilla/5.0" "$IN_ICON_URL" -o app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          fi
          if [ ! -s app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Build Release APK
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            CLEAN_B64=$(echo "$KEYSTORE_BASE64" | grep -oE 'MII[A-Za-z0-9+/=]+' | head -n 1)
            echo "$CLEAN_B64" | base64 --decode > release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            keytool -genkey -v -keystore release.keystore -alias debugkey -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Debug,O=Debug,C=US" -noprompt
            KS_PASS="android"; ALIAS="debugkey"; K_PASS="android"
          fi
          
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          mkdir -p signed_apk
          
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          fi
          
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass "pass:$KS_PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$K_PASS" --out signed_apk/app-release.apk aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-APK
          path: signed_apk/app-release.apk
