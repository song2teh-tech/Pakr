name: Build Final APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت (مثلاً https://example.com)'
        required: true
      name:
        description: 'نام برنامه'
        required: true
      icon:
        description: 'لینک مستقیم آیکون (jpg یا png)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Install Pillow for Icon processing
        run: pip install Pillow requests

      - name: Create clean project structure
        env:
          URL: ${{ github.event.inputs.url }}
          NAME: ${{ github.event.inputs.name }}
          ICON: ${{ github.event.inputs.icon }}
        run: |
          python3 - <<'PY'
          import os, shutil, textwrap, requests
          from PIL import Image
          from io import BytesIO
          
          shutil.rmtree('app', ignore_errors=True)
          if os.path.exists('build.gradle'): os.remove('build.gradle')
          if os.path.exists('settings.gradle'): os.remove('settings.gradle')
          
          os.makedirs('app/src/main/java/com/myapp')
          os.makedirs('app/src/main/res/mipmap-anydpi-v26')
          os.makedirs('app/src/main/res/values')
          os.makedirs('app/src/main/res/mipmap-hdpi')
          os.makedirs('app/src/main/res/mipmap-xhdpi')
          os.makedirs('app/src/main/res/mipmap-xxhdpi')
          os.makedirs('app/src/main/res/mipmap-xxxhdpi')
          
          url = os.environ['URL']
          name = os.environ['NAME']
          icon = os.environ['ICON']
          
          with open('settings.gradle', 'w') as f: f.write(textwrap.dedent("""
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MyApp"
          include ':app'
          """).strip())
          
          with open('build.gradle', 'w') as f: f.write("plugins { id 'com.android.application' version '8.1.4' apply false }")
          
          with open('app/build.gradle', 'w') as f: f.write(textwrap.dedent("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.myapp'
              compileSdk 34
              defaultConfig { applicationId "com.myapp"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          """).strip())
          
          with open('app/src/main/AndroidManifest.xml', 'w') as f: f.write(textwrap.dedent(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="{name}" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>""").strip())
          
          # تنظیمات WebView برای اجازه دادن به بارگذاری تصاویر HTTP در صفحات HTTPS
          with open('app/src/main/java/com/myapp/MainActivity.java', 'w') as f: f.write(textwrap.dedent(f"""
          package com.myapp;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  
                  // حل مشکل نمایش نشدن تصاویر در اندروید ۵ به بالا
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {{
                      webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }}
                  
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("{url}");
              }}
          }}""").strip())
          
          # پردازش آیکون و ساخت Adaptive Icon
          icon_saved = False
          if icon:
              try:
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                  response = requests.get(icon, headers=headers, timeout=15)
                  response.raise_for_status()
                  img = Image.open(BytesIO(response.content))
                  
                  # ساخت آیکون‌های legacy در سایزهای مختلف
                  for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
                      resized_img = img.convert('RGBA').resize((size, size), Image.Resampling.LANCZOS)
                      resized_img.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png', 'PNG')
                  
                  # ساخت آیکون تطبیقی برای اندروید ۸ به بالا
                  foreground = img.convert('RGBA')
                  padding = int(108 * 0.25)  # 25% حاشیه امن
                  new_size = 108 + 2 * padding
                  new_foreground = Image.new('RGBA', (new_size, new_size), (0, 0, 0, 0))
                  new_foreground.paste(foreground, (padding, padding), foreground)
                  new_foreground = new_foreground.resize((108, 108), Image.Resampling.LANCZOS)
                  new_foreground.save('app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png', 'PNG')
                  
                  icon_saved = True
                  print("✅ Icon downloaded and processed successfully!")
              except Exception as e:
                  print(f"⚠️ Icon processing failed: {e}")
          
          if not icon_saved:
              # ساخت یک آیکون پیش‌فرض ساده در صورت عدم موفقیت
              for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
                  img = Image.new('RGBA', (size, size), (255, 255, 255, 255)) # سفید
                  img.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png', 'PNG')
              img = Image.new('RGBA', (108, 108), (255, 255, 255, 255))
              img.save('app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png', 'PNG')

          # ساخت فایل XML برای آیکون تطبیقی
          with open('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', 'w') as f:
              f.write(textwrap.dedent("""<?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@android:color/transparent" />
                  <foreground android:drawable="@mipmap/ic_launcher_foreground" />
              </adaptive-icon>""").strip())

          # کپی کردن آیکون foreground برای سایر تراکم‌ها (برای اطمینان)
          shutil.copy('app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png', 'app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png')
          shutil.copy('app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png', 'app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png')
          shutil.copy('app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png', 'app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png')
          shutil.copy('app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png', 'app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png')
          
          PY
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build and Sign APK
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          
          if [ -n "$KS" ]; then
            echo "$KS" | grep -oE 'MII[A-Za-z0-9+/=]+' | head -n 1 | base64 -d > k.keystore
            P="$KP"; A="$KA"; PP="$KKP"
          else
            keytool -genkey -v -keystore k.keystore -alias d -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=D" -noprompt
            P="android"; A="d"; PP="android"
          fi
          
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          
          $ANDROID_HOME/build-tools/$BT/zipalign -v -p 4 "$APK_PATH" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks k.keystore --ks-pass "pass:$P" --ks-key-alias "$A" --key-pass "pass:$PP" --out final.apk aligned.apk
      
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-APK
          path: final.apk
