name: Build Final APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس سایت (مثلاً https://example.com)'
        required: true
      name:
        description: 'نام برنامه'
        required: true
      icon:
        description: 'لینک مستقیم آیکون (jpg یا png)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Install Pillow
        run: pip install Pillow requests urllib3

      - name: Create clean project structure
        env:
          URL: ${{ github.event.inputs.url }}
          NAME: ${{ github.event.inputs.name }}
          ICON: ${{ github.event.inputs.icon }}
        run: |
          python3 - <<'PY'
          import os, shutil, textwrap, requests, urllib3
          from PIL import Image
          from io import BytesIO
          
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          shutil.rmtree('app', ignore_errors=True)
          if os.path.exists('build.gradle'): os.remove('build.gradle')
          if os.path.exists('settings.gradle'): os.remove('settings.gradle')
          
          os.makedirs('app/src/main/java/com/myapp')
          for d in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              os.makedirs(f'app/src/main/res/mipmap-{d}', exist_ok=True)
          
          url = os.environ['URL']
          name = os.environ['NAME']
          icon = os.environ['ICON']
          
          with open('settings.gradle', 'w') as f: f.write(textwrap.dedent("""
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MyApp"
          include ':app'
          """).strip())
          
          with open('build.gradle', 'w') as f: f.write("plugins { id 'com.android.application' version '8.1.4' apply false }")
          
          with open('app/build.gradle', 'w') as f: f.write(textwrap.dedent("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.myapp'
              compileSdk 34
              defaultConfig { applicationId "com.myapp"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          """).strip())
          
          # حذف کامل آیکون تطبیقی (مشکل مشکی شدن)
          with open('app/src/main/AndroidManifest.xml', 'w') as f: f.write(textwrap.dedent(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application 
                  android:label="{name}" 
                  android:icon="@mipmap/ic_launcher" 
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>""").strip())
          
          with open('app/src/main/java/com/myapp/MainActivity.java', 'w') as f: f.write(textwrap.dedent(f"""
          package com.myapp;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setLoadsImagesAutomatically(true);
                  webSettings.setBlockNetworkImage(false);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {{
                      webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }}
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("{url}");
              }}
          }}""").strip())
          
          # پردازش آیکون: فقط PNG معمولی، بدون adaptive-icon
          icon_saved = False
          if icon:
              try:
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                      'Referer': 'https://postimages.org/'
                  }
                  response = requests.get(icon, headers=headers, timeout=15, verify=False)
                  response.raise_for_status()
                  img = Image.open(BytesIO(response.content))
                  
                  for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
                      resized_img = img.convert('RGBA').resize((size, size), Image.Resampling.LANCZOS)
                      resized_img.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png', 'PNG')
                  
                  icon_saved = True
                  print("✅ Icon downloaded and saved successfully!")
              except Exception as e:
                  print(f"⚠️ Icon processing failed: {e}")
          
          if not icon_saved:
              # آیکون پیش‌فرض بنفش (در صورت شکست دانلود)
              print("⚠️ Using fallback blue icon.")
              for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
                  img = Image.new('RGBA', (size, size), (109, 94, 252, 255))
                  img.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png', 'PNG')
          
          PY
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build and Sign APK
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          
          if [ -n "$KS" ]; then
            echo "$KS" | grep -oE 'MII[A-Za-z0-9+/=]+' | head -n 1 | base64 -d > k.keystore
            P="$KP"; A="$KA"; PP="$KKP"
          else
            keytool -genkey -v -keystore k.keystore -alias d -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=D" -noprompt
            P="android"; A="d"; PP="android"
          fi
          
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          
          $ANDROID_HOME/build-tools/$BT/zipalign -v -p 4 "$APK_PATH" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks k.keystore --ks-pass "pass:$P" --ks-key-alias "$A" --key-pass "pass:$PP" --out final.apk aligned.apk
      
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-APK
          path: final.apk
